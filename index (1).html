<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adi Jain | Engineering Portfolio</title>
  <meta
    name="description"
    content="Engineering portfolio of Adi Jain, Electrical Engineering student at the University of British Columbia."
  />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      background: #173c57;
      color: white;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .button:hover {
      background: rgba(255,255,255,0.12);
    }

    .viewer {
      flex: 1;
      width: 100%;
      border: 0;
      background: white;
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <h1 class="title">Adi Jain | Engineering Portfolio</h1>

      <nav class="actions" aria-label="Portfolio actions">
        <a
          class="button"
          href="Adi%27s%20Portfolio.pdf"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open PDF
        </a>

        <a
          class="button"
          href="Adi%27s%20Portfolio.pdf"
          download
        >
          Download PDF
        </a>
      </nav>
    </header>

    <object
      class="viewer"
      data="Adi%27s%20Portfolio.pdf"
      type="application/pdf"
      aria-label="Adi Jain Engineering Portfolio"
    >
      <p style="padding:20px;">
        Your browser could not display the PDF.
        <a href="Adi%27s%20Portfolio.pdf">Open the portfolio here.</a>
      </p>
    </object>
  </main>
</body>
</html>
